apiVersion: v1
kind: Namespace
metadata:
  name: skymythos-website
  labels:
    kubernetes.io/metadata.name: skymythos-website
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skymythos-website
  namespace: skymythos-website
  labels:
    app: skymythos-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skymythos-website
  template:
    metadata:
      labels:
        app: skymythos-website
    spec:
      containers:
        - name: web
          image: skymythos-website:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: skymythos-website
  namespace: skymythos-website
  labels:
    app: skymythos-website
spec:
  type: ClusterIP
  selector:
    app: skymythos-website
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: skymythos-website
  namespace: skymythos-website
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lattice-hub
      namespace: pole-ui-review
      sectionName: skymythos-website
  hostnames:
    - skymythos-website.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: skymythos-website
          port: 80
          weight: 1
